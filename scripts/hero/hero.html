<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile hero</title>
<style>
@font-face { font-family: Jakarta; src: url(/scripts/fonts/PlusJakartaSans-ExtraBold.ttf); font-weight: 800; }
@font-face { font-family: Jakarta; src: url(/scripts/fonts/PlusJakartaSans-SemiBold.ttf); font-weight: 600; }
@font-face { font-family: Jakarta; src: url(/scripts/fonts/PlusJakartaSans-Medium.ttf); font-weight: 500; }
@font-face { font-family: JBMono; src: url(/scripts/fonts/JetBrainsMono-Medium.ttf); font-weight: 500; }
:root { --ink: #071519; --text: #E8F5F2; --muted: #A9C4BF; --teal: #2DD4BF; --mint: #99F6E4; --indigo: #8B93F8; }
html, body { margin: 0; background: transparent; }
#hero { position: relative; width: 1200px; height: 520px; border-radius: 24px; overflow: hidden; background: var(--ink); }
canvas { position: absolute; inset: 0; width: 1200px; height: 520px; }
.shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgb(7 21 25 / .92) 0%, rgb(7 21 25 / .78) 38%, rgb(7 21 25 / 0) 62%); }
.copy { position: absolute; left: 64px; top: 0; bottom: 0; width: 620px; display: flex; flex-direction: column; justify-content: center; font-family: Jakarta, sans-serif; color: var(--text); }
h1 { margin: 0; font-weight: 800; font-size: 88px; line-height: .98; letter-spacing: -0.035em; }
.role { margin: 26px 0 0; font-weight: 600; font-size: 23px; color: var(--teal); }
p { margin: 12px 0 0; font-weight: 500; font-size: 21px; line-height: 1.5; color: var(--muted); max-width: 31ch; }
.status { display: inline-flex; align-items: center; gap: 10px; margin-top: 30px; padding: 10px 18px 10px 14px; width: fit-content; border-radius: 999px; font-weight: 600; font-size: 16px; color: var(--text); background: rgb(45 212 191 / .1); border: 1px solid rgb(45 212 191 / .35); }
.status i { width: 9px; height: 9px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 4px rgb(45 212 191 / .2), 0 0 14px var(--teal); }
.row { display: flex; align-items: center; gap: 18px; margin-top: 30px; }
.row .status { margin-top: 0; }
.facts { display: flex; gap: 16px; font-weight: 500; font-size: 15px; color: var(--muted); }
.facts b { font-weight: 800; color: var(--text); margin-right: 4px; }
.edge { position: absolute; inset: 0; border-radius: 24px; box-shadow: inset 0 0 0 1.5px rgb(45 212 191 / .28); pointer-events: none; }
</style>
</head>
<body>
<div id="hero">
  <canvas id="stage" width="1200" height="520"></canvas>
  <div class="shade"></div>
  <div class="copy">
    <h1>Vedprakash<br>Dhaka</h1>
    <div class="role">Full-stack engineer, Ahmedabad</div>
    <p>I build Laravel and React apps for businesses, and the pipelines that ship them safely.</p>
    <div class="row"><div class="status"><i></i>Open to freelance and contract work</div><div id="facts" class="facts"></div></div>
  </div>
  <div class="edge"></div>
</div>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }</script>
<script type="module" src="./scene.js"></script>
</body>
</html>
